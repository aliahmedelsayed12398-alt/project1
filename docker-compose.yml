version: "3.9"
services:
  voice-service:
    build: ./services/voice-telephony
    ports:
      - "8001:8000"

  rag-service:
    build: ./services/rag-analytics
    ports:
      - "8002:8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_service
